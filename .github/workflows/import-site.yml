name: Import Tony Carrasco site

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-site.yml

permissions:
  contents: write

jobs:
  import-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination
        uses: actions/checkout@v4

      - name: Download existing Tony Carrasco site
        run: |
          git clone --depth 1 https://github.com/djcarlos305/viberecordsmiami-site.git /tmp/viberecordsmiami-site
          cp -a /tmp/viberecordsmiami-site/tony-carrasco-preview/. .
          touch .nojekyll

      - name: Commit imported site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Import Tony Carrasco website and music player"
          git push
